name: API Auth Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  secret-names:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.build.outputs.names }}
    steps:
      - name: Build the secret names
        id: build
        env:
          SECRET_NAMES: |
            - BETTER_AUTH_SECRET
            - AUTH_SECRET
            - INTERNAL_API_SECRET
            - DATABASE_URL
            - REDIS_URL
            - GOOGLE_CLOUD_PROJECT_ID
            - FIREBASE_ADMIN_CLIENT_EMAIL
            - FIREBASE_ADMIN_PRIVATE_KEY
            - RESEND_API_KEY
            - RESEND_FROM_EMAIL
            - NEON_AUTH_BASE_URL
            - GOOGLE_CLIENT_SECRET
            - GITHUB_CLIENT_SECRET
            - GH_APP_CLIENT_SECRET
            - GH_APP_PRIVATE_KEY
            - GH_OAUTH_CLIENT_SECRET
            - CLOUDFLARE_TURNSTILE_SECRET
            - MICROSOFT_CLIENT_SECRET
            - STORAGE_ENDPOINT
            - STORAGE_ACCESS_KEY_ID
            - STORAGE_SECRET_ACCESS_KEY
        run: sed 's/^- //' <<< "$SECRET_NAMES" | xargs | sed 's/^/names=/' >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref_name == 'main'
    needs: secret-names
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: api-auth-karasu256-com
          secret-names: ${{ needs.secret-names.outputs.names }}
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}

  preview:
    if: github.ref_name != 'main'
    needs: secret-names
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: preview
          worker-name: api-auth-karasu256-com
          secret-names: ${{ needs.secret-names.outputs.names }}
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
