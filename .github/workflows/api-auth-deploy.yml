# Moved from Karasu-Lab/Karasu-Lab/.github/workflows/api-auth-deploy.yml.
# This app depends on workspace packages, so the deploy still builds in
# the hub repository's tree: this workflow clones the hub (with its
# submodules) and pins this app's submodule to the commit that triggered
# the run. It requires the hub's main branch to carry the submodule
# layout, and this repository to hold the Actions secrets and variables
# referenced below under the same names.
#
# Secrets and variables are organized by GitHub Environments: the deploy
# job runs in the `production` environment and the preview job in the
# `preview` environment, and any name an environment does not define
# falls back to the repository-level secret or variable — there are no
# prefixed duplicates. Non-secret identifiers (OAuth client IDs, the
# Firebase project and service account identifiers, URLs, the sender
# address) are variables, not secrets.
name: api-auth.karasu256.com Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: api-auth-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch main https://github.com/Karasu-Lab/Karasu-Lab.git .
          git -C apps/api-auth.karasu256.com fetch origin "${{ github.sha }}"
          git -C apps/api-auth.karasu256.com checkout --detach "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter api-auth.karasu256.com deploy

      - name: Sync worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ vars.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/api-auth.karasu256.com "$RUNNER_TEMP/api-auth-secrets.json" BETTER_AUTH_SECRET AUTH_SECRET INTERNAL_API_SECRET DATABASE_URL FIREBASE_ADMIN_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY RESEND_API_KEY RESEND_FROM_EMAIL NEON_AUTH_BASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
          pnpm --filter api-auth.karasu256.com exec wrangler secret bulk "$RUNNER_TEMP/api-auth-secrets.json"

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch main https://github.com/Karasu-Lab/Karasu-Lab.git .
          git -C apps/api-auth.karasu256.com fetch origin "${{ github.sha }}"
          git -C apps/api-auth.karasu256.com checkout --detach "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ vars.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/api-auth.karasu256.com "$RUNNER_TEMP/api-auth-preview-secrets.json" BETTER_AUTH_SECRET AUTH_SECRET INTERNAL_API_SECRET DATABASE_URL FIREBASE_ADMIN_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY RESEND_API_KEY RESEND_FROM_EMAIL NEON_AUTH_BASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
          pnpm --filter api-auth.karasu256.com preview -- --name "${{ github.ref_name }}" --secrets-file "$RUNNER_TEMP/api-auth-preview-secrets.json"
