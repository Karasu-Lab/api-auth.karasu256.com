name: API Auth Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Deployment itself lives in Karasu-Lab/WorkersDeploy: it deploys this
# app standalone from this repository, detects the Elysia project,
# builds it with Vite, and deploys it to Cloudflare Workers.

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
      CLOUDFLARE_TURNSTILE_SECRET: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: api-auth-karasu256-com
          secret-names: BETTER_AUTH_SECRET AUTH_SECRET INTERNAL_API_SECRET DATABASE_URL GOOGLE_CLOUD_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY RESEND_API_KEY RESEND_FROM_EMAIL NEON_AUTH_BASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET CLOUDFLARE_TURNSTILE_SECRET

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
      CLOUDFLARE_TURNSTILE_SECRET: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: preview
          worker-name: api-auth-karasu256-com
          secret-names: BETTER_AUTH_SECRET AUTH_SECRET INTERNAL_API_SECRET DATABASE_URL GOOGLE_CLOUD_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY RESEND_API_KEY RESEND_FROM_EMAIL NEON_AUTH_BASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET CLOUDFLARE_TURNSTILE_SECRET
