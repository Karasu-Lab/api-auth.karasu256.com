name: Preview Migrations

on:
  push:
    branches-ignore:
      - main
    paths:
      - drizzle/migrations/**
      - drizzle.config.ts
      - src/db/schema/**
      - .github/workflows/neon-pr-migrate.yml
  workflow_dispatch:

concurrency:
  group: neon-dev-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name != github.event.repository.default_branch
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the dev database
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node .github/scripts/neon-branch-url.mjs dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set "@karasu-lab:registry" https://npm.pkg.github.com
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:migrate:deploy
