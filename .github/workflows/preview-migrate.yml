name: Preview Migrations

on:
  push:
    branches-ignore:
      - main
    paths:
      - drizzle/migrations/**
      - drizzle.config.ts
      - src/db/schema/**
      - .github/workflows/preview-migrate.yml
  workflow_dispatch:

concurrency:
  group: preview-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name != github.event.repository.default_branch
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set "@karasu-lab:registry" https://npm.pkg.github.com
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to the preview database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:deploy
